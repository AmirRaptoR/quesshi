name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The archive's participant index and its one-time backfill are only meaningfully testable
    # against a real server: multikey index behaviour, dropping the two indexes it replaces, and a
    # bulk update over legacy rows are all things an in-memory fake would simply agree with.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Quesshi.slnx

      - name: Test deployment script
        run: python3 -m unittest discover --start-directory tests/deploy --verbose

      - name: Build
        run: dotnet build Quesshi.slnx --no-restore --configuration Release

      - name: Test
        # Declaring the connection string makes an unreachable Mongo a test failure rather than a
        # quiet skip, so the index test cannot rot into a vacuous pass.
        env:
          QUESSHI_TEST_MONGO: mongodb://127.0.0.1:27017
        run: dotnet test Quesshi.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  deploy-production:
    name: Deploy production
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: quesshi-production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/quesshi_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/quesshi_deploy" "$HOME/.ssh/known_hosts"

      - name: Transfer and deploy the tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          ssh_options=(-i "$HOME/.ssh/quesshi_deploy" -o BatchMode=yes -o AddressFamily=inet -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          release="/opt/quesshi/releases/$GITHUB_SHA"
          incoming="$release.incoming-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          git archive --format=tar "$GITHUB_SHA" \
            | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "rm -rf -- '$incoming' && install -d -m 700 '$incoming' && tar -xf - -C '$incoming' && rm -rf -- '$release' && mv -- '$incoming' '$release'"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$release/deploy/deploy.sh' '$GITHUB_SHA' '$GITHUB_RUN_NUMBER' '$GITHUB_RUN_ATTEMPT'"
