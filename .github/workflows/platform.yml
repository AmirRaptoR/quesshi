name: Platform

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'docs/platform/**'
      - '.github/workflows/platform.yml'
  push:
    paths:
      - 'platform/**'
      - 'docs/platform/**'
      - '.github/workflows/platform.yml'

permissions:
  actions: read
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:6.0.26
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet restore platform/Quesshi.Platform.slnx
      - run: dotnet build platform/Quesshi.Platform.slnx --no-restore --configuration Release --warnaserror
      - run: dotnet publish platform/src/Quesshi.Web/Quesshi.Web.csproj --no-build --configuration Release --output platform/artifacts/browser-platform
      - run: npm ci --prefix platform/tests/browser
      - run: npx --prefix platform/tests/browser playwright install --with-deps chromium
      - run: npm test --prefix platform/tests/browser
        env:
          PLATFORM_BROWSER_HOST_DIRECTORY: ${{ github.workspace }}/platform/artifacts/browser-platform/wwwroot
      - run: dotnet test platform/Quesshi.Platform.slnx --no-build --configuration Release --results-directory platform/artifacts/coverage/normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          QUESSHI_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
          QUESSHI_TEST_MONGO: mongodb://127.0.0.1:27017
      - run: dotnet test platform/tests/Quesshi.Server.Tests/Quesshi.Server.Tests.csproj --configuration Release -p:QuesshiTestIdentity=true --results-directory platform/artifacts/coverage/identity --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          QUESSHI_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
      - run: dotnet run --project platform/tools/Quesshi.Coverage/Quesshi.Coverage.csproj --no-build --configuration Release -- merge --output platform/artifacts/coverage/cobertura.xml --input-directory platform/artifacts/coverage/normal --input-directory platform/artifacts/coverage/identity
      - run: git diff --unified=0 origin/main...HEAD -- platform > platform/artifacts/coverage/changed.diff
      - run: dotnet run --project platform/tools/Quesshi.Coverage/Quesshi.Coverage.csproj --no-build --configuration Release -- check --coverage platform/artifacts/coverage/cobertura.xml --diff platform/artifacts/coverage/changed.diff --repository-root .
      - name: Find the newest successful main coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/platform.yml/runs?branch=main&status=success&per_page=100" > platform/artifacts/coverage/main-runs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=platform-cobertura&per_page=100" > platform/artifacts/coverage/main-artifacts.json
          run_id="$(dotnet run --project platform/tools/Quesshi.Coverage/Quesshi.Coverage.csproj --no-build --configuration Release -- select-baseline --workflow-runs platform/artifacts/coverage/main-runs.json --artifacts platform/artifacts/coverage/main-artifacts.json)"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the selected main coverage baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: platform-cobertura
          path: platform/artifacts/coverage/baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Reject platform coverage regression from main
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "${{ steps.baseline.outputs.run-id }}" ]; then
            dotnet run --project platform/tools/Quesshi.Coverage/Quesshi.Coverage.csproj --no-build --configuration Release -- baseline --coverage platform/artifacts/coverage/cobertura.xml --baseline platform/artifacts/coverage/baseline/cobertura.xml --repository-root .
          else
            dotnet run --project platform/tools/Quesshi.Coverage/Quesshi.Coverage.csproj --no-build --configuration Release -- baseline --coverage platform/artifacts/coverage/cobertura.xml --repository-root .
          fi
      - name: Store the main coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: platform-cobertura
          path: platform/artifacts/coverage/cobertura.xml
          if-no-files-found: error

  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file platform/deploy/.env.example -f platform/deploy/compose.yaml config --quiet
      - run: docker run --rm -v "$PWD/platform/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: bash platform/deploy/tests/test-deploy.sh
