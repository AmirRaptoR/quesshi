name: Platform

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'docs/platform/**'
  push:
    paths:
      - 'platform/**'
      - 'docs/platform/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore platform/Quesshi.Platform.slnx
      - run: dotnet build platform/Quesshi.Platform.slnx --no-restore --configuration Release --warnaserror
      - run: dotnet test platform/Quesshi.Platform.slnx --no-build --configuration Release
        env:
          QUESSHI_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
