name: Release

# Every merge to main is a release: tested, tagged with the date, published as one image and deployed.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: quesshi-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Version from the date
        run: |
          set -euo pipefail
          day=$(date -u +%Y%m%d)
          count=$(git tag -l "v$day" "v$day.*" | wc -l)
          if [ "$count" -eq 0 ]; then version=$day; else version="$day.$((count + 1))"; fi
          echo "QUESSHI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: QUESSHI_VERSION=${{ env.QUESSHI_VERSION }}
          tags: ghcr.io/amirraptor/quesshi:${{ env.QUESSHI_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Tag the release
        run: |
          git tag "v$QUESSHI_VERSION" "$GITHUB_SHA"
          git push origin "v$QUESSHI_VERSION"

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy" -o BatchMode=yes -o AddressFamily=inet -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' -- "$QUESSHI_VERSION" < scripts/deploy.sh
