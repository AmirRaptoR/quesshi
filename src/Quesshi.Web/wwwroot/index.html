<!DOCTYPE html>
<html lang="fa" dir="rtl" translate="no" class="notranslate">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quesshi</title>
    <base href="/" />
    <meta name="theme-color" content="#090E22" />
    <meta name="description" content="Ask your friends. Persian, English and Dutch trivia duels." />

    <!--
      Machine translation and Blazor cannot coexist. Translate replaces every text node with a
      <font>-wrapped copy, and Blazor keeps writing to the original nodes it still holds references
      to — which are now detached, so the interface silently stops updating. The app carries three
      real languages in a picker instead; these two lines stop the browser offering the broken path.
    -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
</head>
<body>
    <div id="app">
        <div class="spinner" role="status" aria-label="Loading"></div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Reload to carry on.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
      window.quesshi = {
        get: k => localStorage.getItem(k),
        set: (k, v) => localStorage.setItem(k, v),
        remove: k => localStorage.removeItem(k),
        setLang: (lang) => {
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        },
        copy: async (text) => { try { await navigator.clipboard.writeText(text); return true; } catch { return false; } },

        // The lobby's Share pill (issue #90): true means the OS share sheet handled it — accepted,
        // cancelled, whatever the person did with it is theirs to decide, not something the page
        // reacts to. False means there was no such sheet to hand off to at all, which is the one
        // case Lobby.razor falls back to a plain copy for.
        share: async (data) => {
          if (!navigator.share) return false;
          try { await navigator.share(data); } catch { /* cancelled or refused — still handled */ }
          return true;
        },

        // --- sorting questions: the two things a drag genuinely cannot do from C# ---------------
        //
        // Everything else about a sort answer — which row moves where, what the submitted string
        // says — is decided in Quesshi.Web.Services.SortOrdering, where it can be tested. These
        // three are here because they are the browser's own facts: pointer capture and element
        // geometry have no C# equivalent.
        sort: {
          // Without capture, a finger that slides off the narrow grip stops delivering pointermove
          // and the row is abandoned mid-drag — which on a phone is most drags. With it the grip
          // keeps receiving events until the finger lifts, wherever on the screen it goes.
          capture: (el, pointerId) => { try { el.setPointerCapture(pointerId); } catch { /* the pointer is already gone */ } },
          release: (el, pointerId) => { try { el.releasePointerCapture(pointerId); } catch { /* likewise */ } },

          // Each row's vertical centre in client coordinates, in DOM order, which is the input to
          // SortDrag.TargetPlace. Read once when a drag starts: four short rows are near enough the
          // same height that re-measuring on every pointermove would cost a layout per frame and
          // change nothing.
          midpoints: (list) => [...list.children].map(row => {
            const box = row.getBoundingClientRect();
            return box.top + box.height / 2;
          }),

          // The grip reorders with the arrow keys, which also scroll the page. Preventing that has
          // to happen in a native listener: Blazor's @onkeydown:preventDefault is fixed at render
          // time, so it cannot be "only for the arrows" — and applying it to every key would trap
          // Tab and strand the focus it was added to serve.
          arm: (list) => list.addEventListener('keydown', e => {
            if (e.target.closest('[data-grip]') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) e.preventDefault();
          })
        },

        // --- map questions -----------------------------------------------------------------------
        // A tap in screen pixels to a point in the map's own viewBox units. getScreenCTM is the
        // browser's own answer to that question, so it stays right through any CSS size, any device
        // pixel ratio and any aspect the layout ends up giving the svg. Recomputing it from a
        // bounding rect would be a second, worse copy of a matrix the browser already has.
        mapPoint: (svg, clientX, clientY) => {
          const ctm = svg.getScreenCTM();
          if (!ctm) return null;
          const point = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
          return [point.x, point.y];
        },

        // Google Identity Services, loaded only when a client id is actually configured.
        google: async (clientId, dotnet) => {
          if (!window.google) {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = 'https://accounts.google.com/gsi/client';
              s.async = true; s.onload = resolve; s.onerror = reject;
              document.head.appendChild(s);
            });
          }
          window.google.accounts.id.initialize({
            client_id: clientId,
            callback: r => dotnet.invokeMethodAsync('OnGoogleCredential', r.credential)
          });
          window.google.accounts.id.renderButton(
            document.getElementById('google-button'),
            { theme: 'filled_black', size: 'large', width: 320, shape: 'pill' });
        },

        // --- sounds (#93): six cues synthesised with the Web Audio API, no audio files, so they still
        // play offline in the PWA. Everything mutable lives inside this one closure — an IIFE, unlike
        // every other property here — because "has the page seen a gesture yet" and "the AudioContext
        // itself" are both private state a getter/method pair needs to share, and nothing else in this
        // object needs that. The mute switch and the autoplay gate are both re-checked by Quesshi.Web's
        // Sounds service on every call rather than here, so this stays pure mechanism: told to play a
        // named cue, on an armed context, it plays it — it never itself decides whether it should.
        sounds: (() => {
          let ctx = null;
          let armed = false;

          // The autoplay policy: a context created outside a user gesture starts (and stays) suspended,
          // and scheduling sound on a suspended context is legal but silent — never an exception, which
          // is exactly the "no-op before the first gesture" the spec asks for even if this listener
          // somehow never fired. Two event types because a keyboard-only player never fires a pointer
          // event; {once:true} on each retires itself the instant either does, so a second tap later
          // never tries to recreate or re-resume an already-running context.
          const arm = () => {
            if (armed) return;
            armed = true;
            try {
              ctx = new (window.AudioContext || window.webkitAudioContext)();
              ctx.resume();
            } catch { /* Web Audio unsupported — every cue below stays a permanent, silent no-op */ }
          };
          document.addEventListener('pointerdown', arm, { once: true });
          document.addEventListener('keydown', arm, { once: true });

          // One short tone with a gain envelope — a fast linear attack so it does not click in, an
          // exponential release so it does not click out either. exponentialRampToValueAtTime cannot
          // target exactly 0 (it multiplies toward it forever), hence the 0.0001 floor.
          const note = (freq, start, dur, type, peak) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain).connect(ctx.destination);
            const t = ctx.currentTime + start;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(peak, t + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.start(t);
            osc.stop(t + dur + 0.02);
          };

          // Every cue under 400ms, peak gain around 0.15 — quiet enough to sit under a phone's own
          // notification volume. roundStart and tick sit a little quieter still (0.08-0.1): they fire
          // far more often than the other four, so they are the ones a player actually lives with.
          const cues = {
            correct: () => { note(660, 0, 0.12, 'sine', 0.15); note(880, 0.1, 0.16, 'sine', 0.15); },
            wrong: () => note(160, 0, 0.25, 'triangle', 0.15),
            roundStart: () => note(880, 0, 0.09, 'sine', 0.1),
            tick: () => note(1200, 0, 0.05, 'square', 0.08),
            win: () => { note(523, 0, 0.12, 'sine', 0.15); note(659, 0.1, 0.12, 'sine', 0.15); note(784, 0.2, 0.18, 'sine', 0.15); },
            loss: () => { note(440, 0, 0.14, 'sine', 0.15); note(330, 0.12, 0.2, 'sine', 0.15); }
          };

          return {
            // Quesshi.Web.Services.Sounds checks this before ever calling play — a cheap boolean read,
            // not audio work, so there is nothing wrong with asking it on every single cue.
            armed: () => armed,
            play: (name) => { if (armed && cues[name]) cues[name](); },
            // The settings switch (#91) reads this straight off window.quesshi, with no Blazor round
            // trip: on once a gesture has happened and the player has not muted the same "quesshi.sounds"
            // key every cue call already re-reads.
            get enabled() { return armed && localStorage.getItem('quesshi.sounds') !== '0'; }
          };
        })()
      };
    </script>
    <script>
      // The worker is what makes the app installable, and a new deploy replaces it under us;
      // reload once so the running tab picks it up instead of quietly staying on the old bundle.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');

        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          location.reload();
        });
      }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
