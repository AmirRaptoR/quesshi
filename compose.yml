# podman compose up -d   (or: docker compose up -d)
services:
  mongo:
    image: docker.io/library/mongo:7
    container_name: quesshi-mongo
    ports: ["27017:27017"]
    volumes: ["quesshi-mongo:/data/db"]
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: quesshi-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["quesshi-redis:/data"]
    restart: unless-stopped

volumes:
  quesshi-mongo:
  quesshi-redis:
